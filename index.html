<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool Selector Menu</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <link rel="icon" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <!-- Load Tailwind CSS via CDN for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <style>
        /* Custom Styles for Inter font and general reset */
        :root {
            font-family: 'Inter', sans-serif;
        }
        /* Style for the main content frame */
        #main-iframe {
            /* Full height minus header, and minus the tool dropdown bar when shown */
            height: calc(100vh - 80px - var(--toolbar-h, 0px));
        }

        /* Hide the scrollbar for the menu on specific devices */
        #tool-menu::-webkit-scrollbar {
            display: none;
        }
        #tool-menu {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">

    <!-- Header -->
    <header class="bg-white shadow-md p-4 flex items-center justify-between z-10">
        <h1 class="text-2xl font-bold text-indigo-700">
            My Utilities
        </h1>
        <div class="flex items-center gap-2">
            <label for="layout-select" class="text-sm text-gray-600 hidden sm:inline">Menu</label>
            <select id="layout-select" aria-label="Tools menu position" class="text-sm border border-gray-300 rounded-md px-2 py-1 bg-white text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <option value="sidebar">Sidebar</option>
                <option value="top">Top dropdown</option>
                <option value="bottom">Bottom dropdown</option>
            </select>
            <div id="menu-toggle-wrap" class="md:hidden">
                <button id="menu-toggle" class="p-2 rounded-md hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Tool dropdown bar: moved above or below the layout by applyMenuLayout() -->
    <div id="tool-bar" class="bg-white border-gray-200 px-4 py-2 items-center gap-2" style="display: none;">
        <label for="tool-select" class="text-sm font-medium text-gray-700 whitespace-nowrap">Tool</label>
        <select id="tool-select" class="flex-1 min-w-0 border border-gray-300 rounded-md px-2 py-2 bg-white text-gray-800 focus:outline-none focus:ring-2 focus:ring-indigo-500"></select>
    </div>

    <!-- Main Layout (Sidebar + Content) -->
    <div id="app-layout" class="flex flex-1 overflow-hidden">

        <!-- Sidebar Menu -->
        <nav id="tool-menu" class="fixed inset-y-0 left-0 transform -translate-x-full md:relative md:translate-x-0 transition-transform duration-300 ease-in-out w-64 bg-white shadow-lg p-4 overflow-y-auto border-r border-gray-200 md:flex flex-col z-20">
            <h2 class="text-lg font-semibold text-gray-800 mb-4 border-b pb-2">Tools List</h2>
            <div id="menu-items" class="flex flex-col space-y-2">
                <!-- Menu items will be inserted here by JavaScript -->
            </div>
        </nav>

        <!-- Main Content Area -->
        <main class="flex-1 p-4 md:p-6 overflow-hidden">
            <!-- Loading Indicator -->
            <div id="loading-spinner" class="absolute inset-0 flex items-center justify-center bg-gray-50/75 z-40 hidden">
                <div class="animate-spin rounded-full h-16 w-16 border-b-4 border-indigo-600"></div>
                <p class="ml-4 text-indigo-600 font-medium">Loading tool...</p>
            </div>

            <!-- Iframe Container -->
            <div class="h-full w-full rounded-xl overflow-hidden shadow-xl border border-gray-200 bg-white">
                <iframe id="main-iframe" class="w-full h-full" frameborder="0" src="" title="Selected Tool Frame"></iframe>
            </div>
        </main>

    </div>

    <script>
        const tools = [
            { id: 'news', title: 'News Feed', file: 'modules/news-feed.html' },
            { id: 'datecalc', title: 'Date Calculator', file: 'modules/datecalc.html' },
            { id: 'passgen', title: 'Password Generator', file: 'modules/pass-gen.html' },
            { id: 'passcheck', title: 'PasswordChecker', file: 'modules/PassCheck.html' },
            { id: 'subnetcal', title: 'Subnet Calculator', file: 'modules/subnetcal.html' },
            { id: 'energy', title: 'Energy Consumption Tracker', file: 'modules/EnergyConsumption-standalone.html' },
            { id: 'insdb', title: 'INS Offline DB Tool', file: 'modules/INS-offlineDB.html' },
            { id: 'mealsugg', title: 'Meal Suggestion Tool', file: 'modules/Meal suggest tool-standalone.html' },
            { id: 'interest', title: 'Interest Calculator Tool', file: 'modules/InterestCalculator.html' },
            { id: 'timertool', title: 'Timer Tool', file: 'modules/TimerTool.html' },
            { id: 'lenstool', title: 'Digital Camera Lens Calculator', file: 'modules/DigitalCamera-Lens-Calculator.html' },
            { id: 'tzviewer', title: 'TimeZone Viewer', file: 'modules/TimeZoneViewer.html' },
      
        ];

        const menuItemsContainer = document.getElementById('menu-items');
        const mainIframe = document.getElementById('main-iframe');
        const loadingSpinner = document.getElementById('loading-spinner');
        const menuToggle = document.getElementById('menu-toggle');
        const toolMenu = document.getElementById('tool-menu');
        const layoutSelect = document.getElementById('layout-select');
        const toolBar = document.getElementById('tool-bar');
        const toolSelect = document.getElementById('tool-select');
        const menuToggleWrap = document.getElementById('menu-toggle-wrap');
        const appLayout = document.getElementById('app-layout');
        const MENU_LAYOUT_KEY = 'launcherMenuLayout';

        let currentActiveToolId = '';

        /**
         * Updates the iframe source and highlights the active menu item.
         * @param {string} toolId - The ID of the tool to load.
         */
        function loadTool(toolId) {
            const tool = tools.find(t => t.id === toolId);
            if (!tool) return;

            // 1. Show loading spinner
            loadingSpinner.classList.remove('hidden');
            mainIframe.style.opacity = '0';
            
            // 2. Set new iframe source
            mainIframe.src = tool.file;

            // 3. Update active state
            if (currentActiveToolId) {
                // FIX: Remove the correct active classes (bg-indigo-600, text-white, shadow-md)
                document.getElementById(`btn-${currentActiveToolId}`).classList.remove('bg-indigo-600', 'text-white', 'shadow-md');
                document.getElementById(`btn-${currentActiveToolId}`).classList.add('hover:bg-indigo-50', 'text-gray-700');
            }

            const newActiveButton = document.getElementById(`btn-${toolId}`);
            newActiveButton.classList.remove('hover:bg-indigo-50', 'text-gray-700');
            // Add the active classes
            newActiveButton.classList.add('bg-indigo-600', 'text-white', 'shadow-md');
            toolSelect.value = toolId;
            currentActiveToolId = toolId;
            
            // On mobile, close the menu after selection
            if (window.innerWidth < 768) {
                toolMenu.classList.add('-translate-x-full');
            }
        }

        /**
         * Populates the menu items in the sidebar.
         */
        function populateMenu() {
            tools.forEach(tool => {
                const button = document.createElement('button');
                button.id = `btn-${tool.id}`;
                button.className = 'w-full text-left p-3 rounded-lg transition duration-150 ease-in-out font-medium text-gray-700 hover:bg-indigo-50';
                button.textContent = tool.title;
                button.onclick = () => loadTool(tool.id);
                menuItemsContainer.appendChild(button);

                const option = document.createElement('option');
                option.value = tool.id;
                option.textContent = tool.title;
                toolSelect.appendChild(option);
            });
        }

        /**
         * Shows the tools list as the sidebar, or as a dropdown bar above/below the tool area.
         * @param {string} layout - 'sidebar' | 'top' | 'bottom'
         */
        function applyMenuLayout(layout) {
            if (!['sidebar', 'top', 'bottom'].includes(layout)) layout = 'sidebar';
            layoutSelect.value = layout;
            const dropdown = layout !== 'sidebar';

            // Inline display beats Tailwind's md:flex / md:hidden on the sidebar and toggle.
            toolMenu.style.display = dropdown ? 'none' : '';
            menuToggleWrap.style.display = dropdown ? 'none' : '';
            toolBar.style.display = dropdown ? 'flex' : 'none';

            if (layout === 'top') {
                appLayout.before(toolBar);
                toolBar.classList.replace('border-t', 'border-b') || toolBar.classList.add('border-b');
                toolBar.style.paddingBottom = '';
            } else if (layout === 'bottom') {
                appLayout.after(toolBar);
                toolBar.classList.replace('border-b', 'border-t') || toolBar.classList.add('border-t');
                toolBar.style.paddingBottom = 'max(0.5rem, env(safe-area-inset-bottom))';
            }
            document.documentElement.style.setProperty('--toolbar-h', dropdown ? `${toolBar.offsetHeight}px` : '0px');
        }

        layoutSelect.addEventListener('change', () => {
            applyMenuLayout(layoutSelect.value);
            try { localStorage.setItem(MENU_LAYOUT_KEY, layoutSelect.value); } catch (e) { /* storage blocked: layout just isn't remembered */ }
        });

        toolSelect.addEventListener('change', () => loadTool(toolSelect.value));

        // Toggle mobile menu visibility
        menuToggle.addEventListener('click', () => {
            toolMenu.classList.toggle('-translate-x-full');
        });

        // Initialize the app
        document.addEventListener('DOMContentLoaded', () => {
            populateMenu();

            let savedLayout = 'sidebar';
            try { savedLayout = localStorage.getItem(MENU_LAYOUT_KEY) || 'sidebar'; } catch (e) { /* storage blocked: use default */ }
            applyMenuLayout(savedLayout);

            // Add listener to hide loading spinner once iframe content loads
            mainIframe.onload = () => {
                // Hide spinner and fade in iframe
                loadingSpinner.classList.add('hidden');
                mainIframe.style.opacity = '1';
                mainIframe.focus(); // Set focus for keyboard users
            };

            // Load the first tool by default
            if (tools.length > 0) {
                loadTool(tools[0].id);
            }
        });

        // Register service worker for offline/installable support, and let the user
        // decide when a newly published version takes over.
        if ('serviceWorker' in navigator) {
            let updateAccepted = false;

            function showUpdateBanner(waitingWorker) {
                if (document.getElementById('update-banner')) return;
                const banner = document.createElement('div');
                banner.id = 'update-banner';
                banner.setAttribute('role', 'status');
                banner.className = 'fixed bottom-4 left-1/2 -translate-x-1/2 z-50 flex items-center gap-3 bg-indigo-700 text-white rounded-xl shadow-xl px-4 py-3 text-sm max-w-[calc(100vw-2rem)]';
                banner.innerHTML = `
                    <span>A new version is available.</span>
                    <button id="update-accept" class="bg-white text-indigo-700 font-semibold rounded-lg px-3 py-1 hover:bg-indigo-50">Update</button>
                    <button id="update-later" class="text-indigo-100 hover:text-white px-2 py-1">Later</button>`;
                document.body.appendChild(banner);
                document.getElementById('update-accept').onclick = () => {
                    updateAccepted = true;
                    banner.querySelector('span').textContent = 'Updating...';
                    waitingWorker.postMessage('SKIP_WAITING');
                };
                document.getElementById('update-later').onclick = () => banner.remove();
            }

            // Reload only after an accepted update; the first-ever install also fires
            // controllerchange (clients.claim) and must not reload the page.
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (updateAccepted) window.location.reload();
            });

            window.addEventListener('load', async () => {
                try {
                    const reg = await navigator.serviceWorker.register('sw.js');
                    // A waiting worker with an existing controller means a new version is ready.
                    const promptIfWaiting = () => {
                        if (reg.waiting && navigator.serviceWorker.controller) showUpdateBanner(reg.waiting);
                    };
                    promptIfWaiting();
                    reg.addEventListener('updatefound', () => {
                        const incoming = reg.installing;
                        if (!incoming) return;
                        incoming.addEventListener('statechange', () => {
                            if (incoming.state === 'installed') promptIfWaiting();
                        });
                    });
                    // An installed app can stay open for days; re-check when it comes back into view.
                    document.addEventListener('visibilitychange', () => {
                        if (document.visibilityState === 'visible') reg.update().catch(() => {});
                    });
                } catch (err) {
                    console.error('Service worker registration failed:', err);
                }
            });
        }

        // Ask the browser to treat this origin's storage (cache, localStorage) as
        // "persistent" so it won't be silently evicted under storage pressure,
        // which would otherwise break offline reloads and each tool's saved data.
        // NOTE: Chromium grants this silently based on engagement heuristics (no
        // user-facing prompt), and DevTools has no dedicated "Persisted" field, so
        // the result is logged here for visibility instead.
        if (navigator.storage && navigator.storage.persist) {
            navigator.storage.persisted().then((already) => {
                console.log('[storage] already persisted:', already);
                if (!already) {
                    navigator.storage.persist().then((granted) => {
                        console.log('[storage] persist() granted:', granted);
                    });
                }
            });
        } else {
            console.log('[storage] Storage persistence API not supported in this browser.');
        }
    </script>

</body>
</html>
